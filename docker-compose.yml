services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meridian-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FLIGHT_SOURCE=mock-aidx
      - AI_PROVIDER=offline-template-llm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - meridian-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meridian-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - meridian-network

networks:
  meridian-network:
    driver: bridge
